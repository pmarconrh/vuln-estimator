# Credentials and other sensitive configuration. THIS FILE CONTAINS
# PLACEHOLDER VALUES - it is committed only so `kubectl/oc apply -k kube/`
# works out of the box for trying this mockup out. Replace every value below
# before using anywhere other than a personal sandbox/demo namespace, and
# consider sealed-secrets/external-secrets/vault instead of a plain Secret
# manifest for anything real.
#
# Regenerate the two "change me" values with, e.g.:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: securescope-ai-secrets
  labels:
    app.kubernetes.io/name: securescope-ai
type: Opaque
stringData:
  # Bearer token sent as "Authorization: Bearer <token>" to the ai-scanner
  # service (see kube/configmap.yaml for its URL). Must match that
  # instance's own SCANNER_TOKEN env var.
  APP_AI_SCANNER_TOKEN: "change-me"

  # The two hardcoded demo users (THIS IS A MOCKUP - replace with a real
  # identity provider for anything beyond a demo). Format is just the
  # plain-text password, matching quarkus.security.users.embedded.plain-text.
  QUARKUS_SECURITY_USERS_EMBEDDED_USERS_DEMO: "demo123"
  QUARKUS_SECURITY_USERS_EMBEDDED_USERS_INTERNAL: "internal123"

  # Signs/encrypts the persistent FORM-auth cookie. Without this set,
  # Quarkus generates a new random key on every restart, invalidating every
  # active session (and logging everyone out) each time the pod restarts.
  # Generate your own with: openssl rand -base64 32
  QUARKUS_HTTP_AUTH_FORM_ENCRYPTION_KEY: "REPLACE_ME_WITH_OPENSSL_RAND_BASE64_32"
