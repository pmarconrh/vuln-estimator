<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - SecureScope AI</title>
  <!-- All static assets below are served directly by this application (WebJars / local files) -->
  <!-- no CDN calls, so the app works fully offline / disconnected. -->
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-icon"><i class="bi bi-shield-lock"></i></div>
      <h1 class="h4 text-center fw-bold mb-1">SecureScope AI</h1>
      <p class="text-center text-muted mb-4">Vulnerability assessment cost estimator</p>

      {#if error}
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
        <i class="bi bi-exclamation-circle"></i>
        <span>Invalid username or password. Try again.</span>
      </div>
      {/if}

      <form action="/j_security_check" method="post">
        <div class="mb-3">
          <label for="j_username" class="form-label small fw-semibold">Username</label>
          <input type="text" class="form-control" id="j_username" name="j_username" placeholder="demo" required autofocus>
        </div>
        <div class="mb-4">
          <label for="j_password" class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" id="j_password" name="j_password" placeholder="demo123" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg-cta">
          <i class="bi bi-box-arrow-in-right"></i> Log in
        </button>
      </form>

      <p class="text-center text-muted small mt-4 mb-0">
        Mockup demo credentials: <code>demo</code> / <code>demo123</code>
      </p>
    </div>
  </div>
</body>
</html>
