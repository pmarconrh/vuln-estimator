# =============================================================================
# Vulnerability Assessment Cost Estimator - Mockup application
# =============================================================================

quarkus.application.name=vuln-assessment-estimator

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080
# Allow uploading several ZIP files in a single multipart request.
quarkus.http.limits.max-body-size=250M
quarkus.http.body.uploads-directory=data/uploads-tmp
quarkus.http.body.delete-uploaded-files-on-end=true

# -----------------------------------------------------------------------------
# Fake login (form-based authentication, hardcoded embedded user)
# -----------------------------------------------------------------------------
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/
quarkus.http.auth.form.cookie-name=vuln-mockup-credential

# /logout must be public too: if it required authentication, Quarkus's
# persistent form-auth mechanism would re-issue a fresh valid cookie on the
# same (still-authenticated) response, silently overriding our manual
# "clear the cookie" logic below and defeating the logout.
# /webjars/* and /css|js|img/* are the locally-served static assets (Bootstrap,
# Bootstrap Icons, our own CSS/JS) and must be reachable from the (unauthenticated) login page.
quarkus.http.auth.permission.public.paths=/login,/logout,/css/*,/js/*,/img/*,/webjars/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# -----------------------------------------------------------------------------
# Hardcoded demo users - THIS IS A MOCKUP, not for production use.
#   demo     / demo123     -> roles: user, customer   (regular end-user flow)
#   internal / internal123 -> role:  internal         (can manually change
#                                                        request statuses)
# -----------------------------------------------------------------------------
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.demo=demo123
quarkus.security.users.embedded.roles.demo=user,customer
quarkus.security.users.embedded.users.internal=internal123
quarkus.security.users.embedded.roles.internal=internal

# -----------------------------------------------------------------------------
# Persistence (file-based H2 so demo data survives restarts)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/vuln-mockup;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=update

# -----------------------------------------------------------------------------
# Application-specific
# -----------------------------------------------------------------------------
# Where uploaded ZIP files are stored, one subfolder per request reference id.
app.upload.base-dir=./data/uploads

# -----------------------------------------------------------------------------
# REST client: the real external "ai-scanner" service (confirmed against its
# source and a live local instance - see README "External integrations").
#
#   POST {app.ai-scanner.url}/api/scan/{referenceId}  (multipart: profile, file)
#       -> starts a scan under our own referenceId. On success (201) or 409
#          (a scan with this id already exists - treated as already started)
#          the request moves from SUBMITTED to IN_PROGRESS.
#   GET  {app.ai-scanner.url}/api/scan/{referenceId}
#       -> current scan status. Once state=="succeeded" the response also
#          carries the produced artifact names, which become this request's
#          links and it moves from IN_PROGRESS to VALIDATING.
#
# Every call needs "Authorization: Bearer <app.ai-scanner.token>".
# -----------------------------------------------------------------------------
#app.ai-scanner.url=http://localhost:3000
app.ai-scanner.url=https://scan-ai-scanner-ai-scanner-claude.apps.rosa.rosa-bvpt7.a7mu.p3.openshiftapps.com/
quarkus.rest-client.ai-scanner.url=${app.ai-scanner.url}
quarkus.rest-client.ai-scanner.scope=jakarta.inject.Singleton
quarkus.rest-client.ai-scanner.connect-timeout=5000
quarkus.rest-client.ai-scanner.read-timeout=30000

# Bearer token expected by the ai-scanner instance (its SCANNER_TOKEN env var).
# TODO: this is a placeholder for the local dev instance - replace for any
# other environment.
#app.ai-scanner.token=change-me
app.ai-scanner.token=xxoHglUtArLaydn7in5IsNLU7gf9qGDw1zWUWM7q

# Scan Profile to run (see GET /api/profiles on the ai-scanner instance;
# "security" is the only one configured on the local dev instance).
app.ai-scanner.profile=security

# How often the SUBMITTED -> IN_PROGRESS poller runs (Quarkus duration syntax, e.g. 15s, 1m).
app.polling.submitted-interval=15s

# How often the IN_PROGRESS -> VALIDATING poller runs, expressed in seconds.
app.polling.in-progress-interval-seconds=20
